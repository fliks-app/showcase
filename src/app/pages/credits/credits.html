<section class="mx-auto max-w-3xl px-4 py-16 sm:px-6 lg:px-8">
  <span class="font-display text-sm tracking-widest text-primary uppercase">{{ 'credits.eyebrow' | translate }}</span>
  <h1 class="mt-2 text-3xl font-semibold tracking-tight sm:text-4xl">{{ 'credits.title' | translate }}</h1>
  <p class="mt-3 text-base-content/70">{{ 'credits.subtitle' | translate }}</p>

  <ul class="mt-10 space-y-6">
    @for (p of providers; track p.id) {
      <li>
        <h2 class="text-lg font-semibold">
          <a [href]="p.url" target="_blank" rel="noopener" class="link link-hover">{{ p.name }}</a>
        </h2>
        <p class="mt-1 text-sm text-base-content/70">{{ 'credits.items.' + p.id | translate }}</p>
      </li>
    }
  </ul>

  <p class="mt-12 border-t border-white/10 pt-6 text-sm text-base-content/60">{{ 'credits.disclaimer' | translate }}</p>
</section>
