<div>
  <div role="tablist" class="tabs tabs-box mx-auto w-fit max-w-full flex-wrap justify-center border border-white/10 bg-base-200/80">
    @for (item of items(); track item.image; let i = $index) {
      <button
        role="tab"
        type="button"
        class="tab font-medium"
        [class.tab-active]="active() === i"
        [attr.aria-selected]="active() === i"
        (click)="active.set(i)"
      >
        {{ item.labelKey | translate }}
      </button>
    }
  </div>

  <div
    class="relative mt-6 overflow-hidden bg-base-300"
    [class.rounded-2xl]="!frameless()"
    [class.border]="!frameless()"
    [class.border-white/10]="!frameless()"
    [class.shadow-2xl]="!frameless()"
  >
    @for (item of items(); track item.image; let i = $index) {
      @if (active() === i) {
        <img [src]="item.image" width="1600" [height]="height()" [alt]="item.altKey | translate" class="h-auto w-full" loading="lazy" />
      }
    }
  </div>
</div>
